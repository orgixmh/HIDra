[package]
name = "hidra"
version = "0.1.3"
description = "Open-source configurator for gaming mice and keyboards over raw HID"
authors = ["HIDra contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/luizjr/HIDra"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
